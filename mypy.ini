[mypy]
plugins =
    mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "salesforce.testrunner.settings"

[mypy-tests.*.migrations.*,salesforce.testrunner.example.migrations.*]
ignore_errors = True

[mypy-salesforce.fields,salesforce.testrunner.example.models_template]
disallow_any_generics = False

[mypy-salesforce.testrunner.example.models]
disallow_untyped_defs = False
disallow_any_generics = False
